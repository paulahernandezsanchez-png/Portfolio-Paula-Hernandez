<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Parador Match · WTM 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600;700&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --oro:#c9a84c;
  --oro-palido:#e8d5a3;
  --verde-oscuro:#1a3a1f;
  --verde-medio:#2d6a35;
  --verde-brillo:#4a9454;
  --oscuro:#0d1a0f;
  --crema:#f4ede0;
  --piedra:#8a7a6a;
}

html,body{
  width:100%;height:100%;overflow:hidden;
  background:#0d1a0f;
  font-family:'Lato',sans-serif;
  cursor:none;
}

/* ── CURSOR PERSONALIZADO ── */
#cursor{
  position:fixed;width:12px;height:12px;
  border:1.5px solid var(--oro);border-radius:50%;
  pointer-events:none;z-index:9999;
  transition:transform .15s ease,opacity .15s;
  transform:translate(-50%,-50%);
}
#cursor-trail{
  position:fixed;width:40px;height:40px;
  border:0.5px solid rgba(201,168,76,.25);border-radius:50%;
  pointer-events:none;z-index:9998;
  transition:transform .4s ease;
  transform:translate(-50%,-50%);
}

/* ── FONDO ANIMADO ── */
#bg-canvas{
  position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse 80% 60% at 50% 20%, #1a3a1f 0%, #0a1a0c 50%, #060e07 100%);
}

.particles{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.particle{
  position:absolute;border-radius:50%;
  animation:floatParticle linear infinite;
  opacity:0;
}
@keyframes floatParticle{
  0%{transform:translateY(100vh) rotate(0deg);opacity:0}
  10%{opacity:1}
  90%{opacity:.4}
  100%{transform:translateY(-20vh) rotate(360deg);opacity:0}
}

/* ── LÍNEAS DECORATIVAS DIAGONALES ── */
.deco-lines{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:repeating-linear-gradient(
    -55deg,
    transparent,transparent 80px,
    rgba(201,168,76,.015) 80px,
    rgba(201,168,76,.015) 81px
  );
}

/* ── CONTENEDOR PRINCIPAL ── */
#app{
  position:relative;z-index:10;
  width:100%;height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:20px;
}

/* ── PANEL CENTRAL ── */
.panel{
  width:100%;max-width:680px;
  position:relative;
  animation:panelEntrada .8s cubic-bezier(.16,1,.3,1) forwards;
}
@keyframes panelEntrada{
  from{opacity:0;transform:translateY(30px) scale(.97)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

/* ── CABECERA FIJA ── */
.cabecera{
  text-align:center;margin-bottom:32px;
  position:relative;
}
.logo-escudo{
  font-family:'Cinzel',serif;
  font-size:10px;letter-spacing:5px;text-transform:uppercase;
  color:var(--oro);opacity:.7;margin-bottom:8px;
}
.titulo-app{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(26px,4vw,38px);
  font-weight:300;
  color:var(--crema);
  letter-spacing:2px;
  line-height:1.1;
}
.titulo-app em{
  font-style:italic;color:var(--oro);font-weight:400;
}
.subtitulo-app{
  font-family:'Lato',sans-serif;
  font-size:12px;letter-spacing:3px;text-transform:uppercase;
  color:rgba(244,237,224,.4);margin-top:10px;
}

/* ── BARRA DE PROGRESO ÉPICA ── */
.progreso-wrap{
  width:100%;margin-bottom:28px;position:relative;
  display:flex;align-items:center;gap:12px;
}
.progreso-label{
  font-family:'Cinzel',serif;font-size:11px;
  color:var(--oro);white-space:nowrap;letter-spacing:1px;
}
.progreso-track{
  flex:1;height:2px;
  background:rgba(201,168,76,.15);
  border-radius:1px;position:relative;overflow:hidden;
}
.progreso-fill{
  height:100%;background:var(--oro);
  border-radius:1px;
  transition:width .6s cubic-bezier(.34,1.56,.64,1);
  position:relative;
}
.progreso-fill::after{
  content:'';position:absolute;right:0;top:-2px;
  width:6px;height:6px;border-radius:50%;
  background:var(--oro);
  box-shadow:0 0 8px var(--oro);
}

/* ── TARJETA DE PREGUNTA ── */
.tarjeta-pregunta{
  background:rgba(10,20,12,.7);
  border:0.5px solid rgba(201,168,76,.2);
  border-radius:16px;
  padding:36px 40px;
  backdrop-filter:blur(20px);
  position:relative;overflow:hidden;
  box-shadow:
    0 40px 80px rgba(0,0,0,.6),
    inset 0 1px 0 rgba(201,168,76,.1);
}
.tarjeta-pregunta::before{
  content:'';position:absolute;
  top:-1px;left:60px;right:60px;height:1px;
  background:linear-gradient(90deg,transparent,var(--oro),transparent);
}
.tarjeta-pregunta::after{
  content:'';position:absolute;
  inset:0;border-radius:16px;
  background:radial-gradient(ellipse 60% 40% at 50% -20%,rgba(201,168,76,.04),transparent);
  pointer-events:none;
}

.num-pregunta{
  font-family:'Cinzel',serif;
  font-size:64px;font-weight:700;
  color:rgba(201,168,76,.06);
  position:absolute;top:20px;right:32px;
  line-height:1;letter-spacing:-2px;
  user-select:none;
}
.texto-pregunta{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(18px,2.5vw,24px);
  font-weight:400;
  color:var(--crema);
  line-height:1.4;
  margin-bottom:28px;
  position:relative;z-index:1;
}

/* ── OPCIONES ── */
.opciones-grid{
  display:grid;gap:10px;
  position:relative;z-index:1;
}

.boton-opcion{
  position:relative;overflow:hidden;
  background:rgba(26,58,31,.4);
  border:0.5px solid rgba(201,168,76,.2);
  border-radius:10px;
  padding:16px 20px 16px 48px;
  color:var(--crema);
  font-family:'Lato',sans-serif;
  font-size:15px;font-weight:300;
  text-align:left;cursor:none;
  transition:border-color .2s,background .2s;
  letter-spacing:.3px;
  -webkit-tap-highlight-color:transparent;
}
.boton-opcion::before{
  content:'';position:absolute;
  left:0;top:0;bottom:0;width:0;
  background:linear-gradient(90deg,rgba(201,168,76,.12),transparent);
  transition:width .4s ease;
  border-radius:10px 0 0 10px;
}
.boton-opcion:hover{
  border-color:rgba(201,168,76,.5);
  background:rgba(26,58,31,.6);
}
.boton-opcion:hover::before{width:100%}
.boton-opcion:hover .opt-marker{background:var(--oro);color:#0d1a0f}

.opt-marker{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:22px;height:22px;border-radius:50%;
  border:1px solid rgba(201,168,76,.4);
  display:flex;align-items:center;justify-content:center;
  font-family:'Cinzel',serif;font-size:10px;
  color:var(--oro);
  transition:background .2s,color .2s,border-color .2s;
}

/* ESTADO ELEGIDO */
.opcion-elegida{
  border-color:var(--oro) !important;
  background:rgba(201,168,76,.12) !important;
}
.opcion-elegida .opt-marker{
  background:var(--oro);color:#0d1a0f;border-color:var(--oro);
}
.opcion-elegida::before{width:100% !important}

/* ESTADO RECHAZADO - animación de caída */
@keyframes caerYDesvanecerse{
  0%{transform:translateX(0) rotate(0deg);opacity:1}
  30%{transform:translateX(-8px) rotate(-2deg);opacity:.8}
  100%{transform:translateX(120%) rotate(8deg);opacity:0}
}
.opcion-rechazada{
  animation:caerYDesvanecerse .5s cubic-bezier(.4,0,1,1) forwards;
  pointer-events:none;
}

/* ── TRANSICIÓN DE PANTALLA ── */
@keyframes slideOutLeft{
  from{opacity:1;transform:translateX(0) scale(1)}
  to{opacity:0;transform:translateX(-60px) scale(.96)}
}
@keyframes slideInRight{
  from{opacity:0;transform:translateX(60px) scale(.96)}
  to{opacity:1;transform:translateX(0) scale(1)}
}
.slide-out{animation:slideOutLeft .35s cubic-bezier(.4,0,.6,1) forwards}
.slide-in{animation:slideInRight .45s cubic-bezier(.16,1,.3,1) forwards}

/* ── PANTALLA DE RESULTADO ── */
@keyframes revelarResultado{
  0%{opacity:0;transform:translateY(40px) scale(.95)}
  60%{transform:translateY(-4px) scale(1.01)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}
.resultado-container{
  animation:revelarResultado .8s cubic-bezier(.16,1,.3,1) forwards;
}

.resultado-badge{
  font-family:'Cinzel',serif;
  font-size:9px;letter-spacing:5px;text-transform:uppercase;
  color:var(--oro);margin-bottom:20px;
  display:flex;align-items:center;gap:10px;
}
.resultado-badge::before,.resultado-badge::after{
  content:'';flex:1;height:0.5px;background:rgba(201,168,76,.3);
}

.resultado-imagen-wrap{
  position:relative;width:100%;height:220px;
  border-radius:12px;overflow:hidden;
  margin-bottom:20px;
  border:0.5px solid rgba(201,168,76,.2);
}
.resultado-imagen-wrap::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to top,rgba(10,20,12,.8) 0%,transparent 50%);
}
.resultado-img{
  width:100%;height:100%;object-fit:cover;
  display:block;
  animation:kenBurns 12s ease-out forwards;
}
@keyframes kenBurns{
  from{transform:scale(1.06)}
  to{transform:scale(1)}
}
.resultado-img-fallback{
  width:100%;height:100%;
  background:radial-gradient(ellipse at center,#1a3a1f,#0a1a0c);
  display:flex;align-items:center;justify-content:center;
  font-size:60px;
}

.resultado-nombre-wrap{
  position:absolute;bottom:0;left:0;right:0;
  padding:16px 20px;z-index:2;
}
.resultado-nombre{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(22px,3vw,30px);
  font-weight:600;
  color:#fff;
  letter-spacing:.5px;
  text-shadow:0 2px 12px rgba(0,0,0,.8);
}

.resultado-body{
  padding:0 4px;
}
.resultado-etiqueta{
  display:inline-block;
  font-family:'Cinzel',serif;font-size:9px;
  letter-spacing:3px;text-transform:uppercase;
  color:var(--oro);border:0.5px solid rgba(201,168,76,.3);
  padding:4px 10px;border-radius:2px;margin-bottom:12px;
}
.resultado-desc{
  font-family:'Cormorant Garamond',serif;
  font-size:16px;font-weight:300;font-style:italic;
  color:rgba(244,237,224,.7);line-height:1.6;margin-bottom:20px;
}

.resultado-acciones{
  display:flex;gap:10px;flex-wrap:wrap;
}
.btn-reiniciar{
  flex:1;
  background:var(--oro);color:#0d1a0f;
  border:none;border-radius:8px;
  padding:14px 20px;
  font-family:'Cinzel',serif;font-size:11px;
  letter-spacing:2px;text-transform:uppercase;
  cursor:none;font-weight:600;
  transition:background .2s,transform .15s;
}
.btn-reiniciar:hover{background:var(--oro-palido);transform:translateY(-1px)}
.btn-info{
  padding:14px 20px;
  background:transparent;
  border:0.5px solid rgba(201,168,76,.3);
  border-radius:8px;
  font-family:'Cinzel',serif;font-size:10px;
  letter-spacing:2px;text-transform:uppercase;
  color:var(--oro);cursor:none;
  transition:border-color .2s,background .2s;
}
.btn-info:hover{background:rgba(201,168,76,.08);border-color:var(--oro)}

.nota-feria{
  margin-top:16px;
  font-size:11px;letter-spacing:1px;
  color:rgba(244,237,224,.3);
  font-family:'Cinzel',serif;text-align:center;
  text-transform:uppercase;
}

/* ── FLASH DE TRANSICIÓN ── */
#transition-flash{
  position:fixed;inset:0;z-index:100;
  background:#0d1a0f;
  opacity:0;pointer-events:none;
  transition:opacity .15s;
}
#transition-flash.active{opacity:1;pointer-events:all}

/* ── RIPPLE EN BOTÓN ── */
.ripple{
  position:absolute;border-radius:50%;
  background:rgba(201,168,76,.25);
  transform:scale(0);
  animation:rippleAnim .6s linear;
  pointer-events:none;
}
@keyframes rippleAnim{
  to{transform:scale(4);opacity:0}
}

/* ── CONTADOR DE CANDIDATOS VIVOS ── */
.candidatos-bar{
  display:flex;align-items:center;gap:8px;
  margin-top:16px;padding:0 4px;
}
.candidatos-label{
  font-family:'Cinzel',serif;font-size:9px;
  letter-spacing:2px;text-transform:uppercase;
  color:rgba(201,168,76,.4);white-space:nowrap;
}
.candidatos-chips{
  display:flex;flex-wrap:wrap;gap:4px;flex:1;
}
.candidato-chip{
  font-size:10px;font-family:'Lato',sans-serif;
  padding:3px 8px;border-radius:20px;
  border:0.5px solid rgba(201,168,76,.2);
  color:rgba(244,237,224,.4);
  transition:all .4s ease;
}
.candidato-chip.top-3{
  border-color:rgba(201,168,76,.5);
  color:var(--oro);
  background:rgba(201,168,76,.06);
}

/* SCROLL personalizado por si acaso */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:#0d1a0f}
::-webkit-scrollbar-thumb{background:var(--oro);border-radius:2px}

/* ── PORTADA ── */
#vista-portada{
  position:fixed;inset:0;z-index:200;
  display:flex;align-items:center;justify-content:center;
  background:#060e07;
  transition:opacity .8s ease;
}
#vista-portada.saliendo{opacity:0;pointer-events:none}
.portada-inner{position:relative;width:100%;max-width:680px;cursor:none;}
.portada-svg-wrap{
  width:100%;border-radius:8px;overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.9),0 0 0 1px rgba(201,168,76,.15);
}
.portada-svg-wrap svg{display:block;width:100%}
.portada-cta{
  position:absolute;bottom:52px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:10px;
  animation:ctaPulse 2.4s ease-in-out infinite;
}
@keyframes ctaPulse{
  0%,100%{opacity:.7;transform:translateX(-50%) translateY(0)}
  50%{opacity:1;transform:translateX(-50%) translateY(-5px)}
}
.portada-btn{
  font-family:'Cinzel',serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;
  color:#0d1a0f;background:var(--oro);border:none;border-radius:4px;
  padding:13px 36px;cursor:none;
  box-shadow:0 4px 24px rgba(201,168,76,.4);
  transition:background .2s,box-shadow .2s,transform .15s;
}
.portada-btn:hover{background:var(--oro-palido);box-shadow:0 6px 32px rgba(201,168,76,.6);transform:translateY(-2px)}
.portada-hint{font-family:'Cinzel',serif;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:rgba(201,168,76,.45);}
.img-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%;height:100%;}
.loading-castle{font-size:40px;animation:castlePulse 1.4s ease-in-out infinite;}
@keyframes castlePulse{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:.9;transform:scale(1.06)}}
.loading-text{font-family:'Cinzel',serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:rgba(201,168,76,.5);}
</style>
</head>

document.addEventListener('mousemove',e=>{
  mx=e.clientX;my=e.clientY;
  cur.style.left=mx+'px';cur.style.top=my+'px';
});
function animTrail(){
  tx+=(mx-tx)*.12; ty+=(my-ty)*.12;
  trail.style.left=tx+'px'; trail.style.top=ty+'px';
  requestAnimationFrame(animTrail);
}

    {texto:"En pareja, buscando romanticismo y privacidad",a:"relax",p:5},
    {texto:"Con la familia: planes para todos",a:"naturaleza",p:5},
    {texto:"Solo/a, a mi propio ritmo",a:"historia",p:5}
  ]},
  {pregunta:"Al caer la tarde, el plan perfecto es...",opciones:[
    {texto:"Tomar un vino con vista al monumento",a:"gastro",p:5},
    {texto:"Una ruta de senderismo o baño en el mar",a:"naturaleza",p:5},
    {texto:"Una visita guiada con historias de siglos",a:"historia",p:5},
    {texto:"Relax total: spa, lectura y silencio",a:"relax",p:5}
  ]},
  {pregunta:"¿Qué clima prefieres para el viaje?",opciones:[
    {texto:"Sol y calor mediterráneo o atlántico",a:"costa",p:5},
    {texto:"Frío, niebla y chimenea encendida",a:"montana",p:5},
    {texto:"Templado, ideal para explorar a pie",a:"ciudad",p:5}
  ]},
  {pregunta:"¿Qué vista quieres al despertar?",opciones:[
    {texto:"El océano o el mar a los pies",a:"costa",p:5},
    {texto:"Un castillo, una catedral o un claustro",a:"gotico",p:5},
    {texto:"Valles verdes y cimas nevadas",a:"montana",p:5},
    {texto:"La ciudad histórica brillando al amanecer",a:"ciudad",p:5}
  ]},
  {pregunta:"¿Qué recuerdo quieres llevarte?",opciones:[
    {texto:"Haber probado un plato que nunca olvidaré",a:"gastro",p:5},
    {texto:"Haber dormido dentro de la Historia",a:"historia",p:5},
    {texto:"Volver con las pilas cargadas al máximo",a:"relax",p:5}
  ]},
  {pregunta:"Una última pregunta: ¿qué te define como viajero/a?",opciones:[
    {texto:"El explorador curioso que busca autenticidad",a:"historia",p:5},
    {texto:"El hedonista que vive para los placeres",a:"gastro",p:5},
    {texto:"El aventurero que necesita naturaleza salvaje",a:"naturaleza",p:5},
    {texto:"El esteta que busca la belleza en cada rincón",a:"gotico",p:5}
  ]}
];

let pregIdx=0;
let perfil={costa:0,montana:0,ciudad:0,naturaleza:0,gotico:0,convento:0,palacio:0,vanguardia:0,fortaleza:0,relax:0,gastro:0,historia:0};

function pct(){ return Math.round((pregIdx/preguntas.length)*100); }

function calcRanking(){
  return baseDatosParadores.map(p=>{
    let s=0;
    for(let k in perfil){ if(p[k]) s+=perfil[k]; }
    return {...p,score:s};
  }).sort((a,b)=>b.score-a.score);
}

function renderChips(){
  const top5 = calcRanking().slice(0,5);
  const all = calcRanking();
  const el = document.getElementById('chips-candidatos');
  el.innerHTML = top5.map((p,i)=>{
    const short = p.nombre.replace('Parador de ','').replace('Parador del ','');
    return `<span class="candidato-chip ${i<3?'top-3':''}">${short}</span>`;
  }).join('');
}

function addRipple(btn,e){
  const r=document.createElement('div');
  r.className='ripple';
  const rect=btn.getBoundingClientRect();
  const size=Math.max(rect.width,rect.height)*2;
  r.style.cssText=`width:${size}px;height:${size}px;left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px`;
  btn.appendChild(r);
  setTimeout(()=>r.remove(),700);
}

function mostrarPregunta(){
  const datos = preguntas[pregIdx];
  document.getElementById('num-grande').textContent = String(pregIdx+1).padStart(2,'0');
  document.getElementById('texto-pregunta').textContent = datos.pregunta;
  document.getElementById('progreso-label').textContent = `${pregIdx+1} / ${preguntas.length}`;
  document.getElementById('progreso-fill').style.width = pct()+'%';

  const grid = document.getElementById('opciones');
  grid.innerHTML='';
  const letras = ['A','B','C','D'];
  datos.opciones.forEach((op,i)=>{
    const btn = document.createElement('button');
    btn.className='boton-opcion';
    btn.innerHTML=`<span class="opt-marker">${letras[i]}</span>${op.texto}`;
    btn.style.animationDelay=(i*.06)+'s';
    btn.style.opacity='0';
    btn.style.animation=`slideInRight .4s cubic-bezier(.16,1,.3,1) ${i*.07}s forwards`;
    btn.addEventListener('click',function(e){
      addRipple(btn,e);
      const todos = grid.querySelectorAll('.boton-opcion');
      todos.forEach(x=>{ x.style.pointerEvents='none'; });
      btn.classList.add('opcion-elegida');
      todos.forEach(x=>{ if(x!==btn) x.classList.add('opcion-rechazada'); });
      perfil[op.a]+=op.p;
      setTimeout(()=>{
        pregIdx++;
        if(pregIdx>=preguntas.length){
          transicionResultado();
        } else {
          const tarjeta = document.getElementById('tarjeta');
          tarjeta.classList.add('slide-out');
          setTimeout(()=>{
            tarjeta.classList.remove('slide-out');
            mostrarPregunta();
            tarjeta.classList.add('slide-in');
            setTimeout(()=>tarjeta.classList.remove('slide-in'),500);
          },350);
        }
        renderChips();
      },600);
    });
    grid.appendChild(btn);
  });

  renderChips();
}

function transicionResultado(){
  const flash = document.getElementById('transition-flash');
  flash.classList.add('active');
  setTimeout(()=>{
    mostrarResultado();
    flash.style.transition='opacity .5s';
    flash.classList.remove('active');
    setTimeout(()=>{flash.style.transition='opacity .15s'},600);
  },300);
}

const DESCRIPCIONES_EXTRA = {
  "Parador de Granada":"Una noche dentro de la Alhambra. No hay lista de espera para el sueño.",
  "Parador de Santiago de Compostela":"El hotel más antiguo del mundo en uso. El Camino termina —o empieza— aquí.",
  "Parador de León":"La fachada plateresca más larga de Europa. Un libro de piedra abierto ante ti.",
  "Parador de Hondarribia":"La alta gastronomía vasca a un paso. El castillo, el mar y el pintxo perfecto.",
  "Parador de Cangas de Onís":"Los Picos de Europa como fondo. El Sella a los pies. La naturaleza más salvaje.",
  "Parador de Baiona":"Donde las noticias de América llegaron por primera vez. La Ría de Vigo abraza sus murallas.",
};

function mostrarResultado(){
  document.getElementById('vista-pregunta').style.display='none';
  document.getElementById('vista-resultado').style.display='block';
  document.getElementById('progreso-fill').style.width='100%';
  document.getElementById('progreso-label').textContent='✦ Resultado';

  const ranking = calcRanking();
  const g = ranking[0];

  document.getElementById('resultado-nombre').textContent = g.nombre;
  const desc = DESCRIPCIONES_EXTRA[g.nombre] || g.desc || 'Un rincón del patrimonio español que encaja perfectamente con tu forma de viajar.';
  document.getElementById('resultado-desc').textContent = desc;

  const etiquetas = [];
  if(g.costa||g.naturaleza) etiquetas.push('Naturaleza & paisaje');
  if(g.historia||g.gotico) etiquetas.push('Patrimonio histórico');
  if(g.gastro) etiquetas.push('Gastronomía de autor');
  if(g.relax) etiquetas.push('Descanso & bienestar');
  if(g.fortaleza||g.palacio||g.convento) etiquetas.push('Arquitectura monumental');
  document.getElementById('resultado-etiqueta').textContent = etiquetas.slice(0,2).join(' · ') || 'Destino patrimonial recomendado';

  const img = document.getElementById('resultado-img');
  const fallback = document.getElementById('resultado-img-fallback');
  if(g.img){
    img.src=g.img;
    img.style.display='block';
    fallback.style.display='none';
    img.onerror=()=>{ img.style.display='none'; fallback.style.display='flex'; };
  } else {
    img.style.display='none';
    fallback.style.display='flex';
  }

  window._resultadoActual = g;
}

function verWeb(){
  const nombre = window._resultadoActual?.nombre || '';
  const slug = nombre.toLowerCase().replace('parador de ','').replace('parador del ','').replace(/ /g,'-').normalize('NFD').replace(/[̀-ͯ]/g,'');
  window.open(`https://www.parador.es/es/paradores/parador-de-${slug}`,'_blank');
}

function reiniciar(){
  pregIdx=0;
  for(let k in perfil) perfil[k]=0;
  const flash = document.getElementById('transition-flash');
  flash.classList.add('active');
  setTimeout(()=>{
    document.getElementById('vista-resultado').style.display='none';
    document.getElementById('vista-pregunta').style.display='block';
    mostrarPregunta();
    flash.style.transition='opacity .5s';
    flash.classList.remove('active');
    setTimeout(()=>flash.style.transition='opacity .15s',600);
  },300);
}


/* ── PORTADA ── */
function iniciarDesdePortada(){
  const portada = document.getElementById('vista-portada');
  portada.classList.add('saliendo');
  setTimeout(()=>{ portada.style.display='none'; },800);
}

mostrarPregunta();
</script>
